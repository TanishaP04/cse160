<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Three.js World</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #000; overflow: hidden; }
      #info {
        position: fixed;
        top: 16px; left: 50%;
        transform: translateX(-50%);
        color: #fff;
        font-family: 'Segoe UI', sans-serif;
        font-size: 13px;
        background: rgba(0,0,0,0.5);
        padding: 8px 16px;
        border-radius: 20px;
        pointer-events: none;
        text-align: center;
        letter-spacing: 0.04em;
      }
      #wow-note {
        position: fixed;
        bottom: 16px; right: 16px;
        color: #aaffdd;
        font-family: monospace;
        font-size: 11px;
        background: rgba(0,0,0,0.55);
        padding: 8px 12px;
        border-radius: 8px;
        pointer-events: none;
        max-width: 260px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="info">🌍 Three.js World &nbsp;|&nbsp; Drag to orbit &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Right-click to pan</div>
    <div id="wow-note">
      <strong>WOW:</strong> Mini solar system floating above. 
      <strong>Tanisha Prabhu(taprabhu@ucsc.edu)</strong>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
